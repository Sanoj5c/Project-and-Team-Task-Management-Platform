<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Entity Relationship Diagram — TaskFlow Platform</text>

  <!-- USER -->
  <g>
    <rect x="40" y="80" width="220" height="200" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <rect x="40" y="80" width="220" height="30" rx="6" fill="#534AB7"/>
    <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">User</text>
    <text x="52" y="130" font-size="11" fill="#26215C">id (PK, uuid)</text>
    <text x="52" y="150" font-size="11" fill="#26215C">name</text>
    <text x="52" y="170" font-size="11" fill="#26215C">email (unique)</text>
    <text x="52" y="190" font-size="11" fill="#26215C">password (hashed)</text>
    <text x="52" y="210" font-size="11" fill="#26215C">role (enum)</text>
    <text x="52" y="230" font-size="11" fill="#26215C">isActive</text>
    <text x="52" y="250" font-size="11" fill="#26215C">createdAt / updatedAt</text>
  </g>

  <!-- PROJECT -->
  <g>
    <rect x="390" y="80" width="230" height="220" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <rect x="390" y="80" width="230" height="30" rx="6" fill="#0F6E56"/>
    <text x="505" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Project</text>
    <text x="402" y="130" font-size="11" fill="#04342C">id (PK, uuid)</text>
    <text x="402" y="150" font-size="11" fill="#04342C">name</text>
    <text x="402" y="170" font-size="11" fill="#04342C">description</text>
    <text x="402" y="190" font-size="11" fill="#04342C">status (enum)</text>
    <text x="402" y="210" font-size="11" fill="#04342C">startDate</text>
    <text x="402" y="230" font-size="11" fill="#04342C">endDate</text>
    <text x="402" y="250" font-size="11" fill="#04342C">managerId (FK &#8594; User)</text>
    <text x="402" y="270" font-size="11" fill="#04342C">createdAt / updatedAt</text>
  </g>

  <!-- TASK -->
  <g>
    <rect x="760" y="80" width="220" height="220" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <rect x="760" y="80" width="220" height="30" rx="6" fill="#993C1D"/>
    <text x="870" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Task</text>
    <text x="772" y="130" font-size="11" fill="#4A1B0C">id (PK, uuid)</text>
    <text x="772" y="150" font-size="11" fill="#4A1B0C">title</text>
    <text x="772" y="170" font-size="11" fill="#4A1B0C">description</text>
    <text x="772" y="190" font-size="11" fill="#4A1B0C">status (enum)</text>
    <text x="772" y="210" font-size="11" fill="#4A1B0C">dueDate</text>
    <text x="772" y="230" font-size="11" fill="#4A1B0C">projectId (FK &#8594; Project)</text>
    <text x="772" y="250" font-size="11" fill="#4A1B0C">assigneeId (FK &#8594; User)</text>
    <text x="772" y="270" font-size="11" fill="#4A1B0C">createdAt / updatedAt</text>
    <text x="772" y="290" font-size="9" fill="#993C1D" font-style="italic">*fields assumed, verify vs code</text>
  </g>

  <!-- PROJECT MEMBER -->
  <g>
    <rect x="390" y="440" width="230" height="150" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <rect x="390" y="440" width="230" height="30" rx="6" fill="#854F0B"/>
    <text x="505" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ProjectMember</text>
    <text x="402" y="490" font-size="11" fill="#412402">id (PK, uuid)</text>
    <text x="402" y="510" font-size="11" fill="#412402">projectId (FK &#8594; Project)</text>
    <text x="402" y="530" font-size="11" fill="#412402">userId (FK &#8594; User)</text>
    <text x="402" y="550" font-size="11" fill="#412402">joinedAt</text>
    <text x="402" y="570" font-size="9" fill="#854F0B" font-style="italic">unique(projectId, userId)</text>
  </g>

  <!-- Relationship lines -->
  <!-- User -> Project (manages) -->
  <line x1="260" y1="150" x2="390" y2="150" stroke="#555" stroke-width="1"/>
  <text x="325" y="140" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="375" y="140" text-anchor="middle" font-size="10" fill="#333">*</text>
  <text x="325" y="165" text-anchor="middle" font-size="10" fill="#333">manages</text>

  <!-- Project -> Task (has) -->
  <line x1="620" y1="150" x2="760" y2="150" stroke="#555" stroke-width="1"/>
  <text x="635" y="140" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="745" y="140" text-anchor="middle" font-size="10" fill="#333">*</text>
  <text x="690" y="165" text-anchor="middle" font-size="10" fill="#333">has</text>

  <!-- User -> Task (assigned to) -->
  <path d="M 150 280 C 150 400, 750 400, 870 300" fill="none" stroke="#555" stroke-width="1"/>
  <text x="150" y="300" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="860" y="295" text-anchor="middle" font-size="10" fill="#333">*</text>
  <text x="500" y="410" text-anchor="middle" font-size="10" fill="#333">assigned to</text>

  <!-- Project -> ProjectMember (has) -->
  <line x1="505" y1="300" x2="505" y2="440" stroke="#555" stroke-width="1"/>
  <text x="495" y="320" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="495" y="435" text-anchor="middle" font-size="10" fill="#333">*</text>

  <!-- User -> ProjectMember (belongs to, curved) -->
  <path d="M 150 280 C 150 460, 300 515, 390 515" fill="none" stroke="#555" stroke-width="1"/>
  <text x="160" y="300" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="380" y="505" text-anchor="middle" font-size="10" fill="#333">*</text>

  <!-- Legend -->
  <text x="40" y="620" font-size="10" fill="#555">FK = Foreign Key   PK = Primary Key   1 / * = one-to-many cardinality</text>
</svg>