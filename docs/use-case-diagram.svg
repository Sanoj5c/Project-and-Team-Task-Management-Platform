<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="680" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Use Case Diagram — TaskFlow Platform</text>

  <!-- System boundary -->
  <rect x="220" y="60" width="500" height="580" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">TaskFlow Platform</text>

  <!-- Actor: Admin -->
  <g transform="translate(60,140)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="50" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="-18" y2="80" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="18" y2="80" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Admin</text>
  </g>

  <!-- Actor: PM -->
  <g transform="translate(60,340)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="50" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="-18" y2="80" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="18" y2="80" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Project</text>
    <text x="0" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Manager</text>
  </g>

  <!-- Actor: Team Member -->
  <g transform="translate(60,540)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="50" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="-18" y2="80" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="18" y2="80" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Team</text>
    <text x="0" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Member</text>
  </g>

  <!-- Use case ovals -->
  <ellipse cx="420" cy="100" rx="90" ry="26" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#26215C">Register / Login</text>

  <ellipse cx="600" cy="150" rx="90" ry="26" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="600" y="154" text-anchor="middle" font-size="11" fill="#26215C">Manage users</text>

  <ellipse cx="420" cy="200" rx="90" ry="26" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="420" y="204" text-anchor="middle" font-size="11" fill="#26215C">View all projects</text>

  <ellipse cx="600" cy="260" rx="90" ry="26" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="600" y="256" text-anchor="middle" font-size="11" fill="#04342C">Create / update /</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#04342C">delete project</text>

  <ellipse cx="420" cy="320" rx="90" ry="26" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="420" y="316" text-anchor="middle" font-size="11" fill="#04342C">Add / remove</text>
  <text x="420" y="330" text-anchor="middle" font-size="11" fill="#04342C">project member</text>

  <ellipse cx="600" cy="380" rx="90" ry="26" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="600" y="376" text-anchor="middle" font-size="11" fill="#04342C">Create &amp; assign</text>
  <text x="600" y="390" text-anchor="middle" font-size="11" fill="#04342C">task</text>

  <ellipse cx="420" cy="440" rx="90" ry="26" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="420" y="436" text-anchor="middle" font-size="11" fill="#412402">Update task</text>
  <text x="420" y="450" text-anchor="middle" font-size="11" fill="#412402">status</text>

  <ellipse cx="600" cy="490" rx="90" ry="26" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="600" y="486" text-anchor="middle" font-size="11" fill="#412402">View project</text>
  <text x="600" y="500" text-anchor="middle" font-size="11" fill="#412402">Kanban board</text>

  <ellipse cx="420" cy="560" rx="90" ry="26" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="420" y="564" text-anchor="middle" font-size="11" fill="#412402">View my tasks</text>

  <!-- Connectors: Admin -->
  <line x1="72" y1="150" x2="330" y2="105" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="150" x2="510" y2="150" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="150" x2="330" y2="200" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="150" x2="510" y2="260" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="150" x2="330" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="150" x2="510" y2="380" stroke="#666" stroke-width="1"/>

  <!-- Connectors: PM -->
  <line x1="72" y1="350" x2="330" y2="105" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="350" x2="510" y2="260" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="350" x2="330" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="350" x2="510" y2="380" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="350" x2="330" y2="440" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="350" x2="510" y2="490" stroke="#666" stroke-width="1"/>

  <!-- Connectors: Team Member -->
  <line x1="72" y1="550" x2="330" y2="105" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="550" x2="330" y2="440" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="550" x2="510" y2="490" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="550" x2="330" y2="560" stroke="#666" stroke-width="1"/>

  <!-- Legend -->
  <text x="230" y="655" font-size="10" fill="#555">Purple = Admin-scoped   Teal = PM/Admin-scoped   Amber = Shared across roles</text>
</svg>